<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PID issuance error</title>
  <style>
    body {
      background: #f6f7f9;
      color: #17202a;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 24px;
    }
    main {
      background: white;
      border: 1px solid #dfe3e8;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgb(0 0 0 / 8%);
      margin: 12vh auto 0;
      max-width: 560px;
      padding: 32px;
      text-align: center;
    }
    h1 { color: #a31616; }
    .code {
      color: #667085;
      font-family: ui-monospace, monospace;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>PID issuance unavailable</h1>
    <p>{{ error_description }}</p>
    <p class="code">{{ error }}</p>
  </main>
</body>
</html>
